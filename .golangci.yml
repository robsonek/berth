version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - nilerr
    - revive
    - unparam
  settings:
    gosec:
      # Writing files and directories with specific modes, and taking file
      # paths from the operator, IS this tool's job: berth provisions
      # servers and manages local config/cache files with deliberate
      # permissions. G301/G302/G306 (dir/file mode "too permissive") and
      # G304 (file path from variable) would be ~20 permanent false
      # positives here. Every other gosec rule stays live.
      excludes:
        - G301
        - G302
        - G304
        - G306
    revive:
      # A bare `rules` list REPLACES revive's default rule set (verified on
      # v2.12.2: only-disabled entries left zero active rules). This flag
      # re-adds the defaults around the explicit entries, so the two
      # disabled rules below genuinely subtract from the default set.
      enable-default-rules: true
      rules:
        # The whole codebase lives under internal/ and cmd/ — there is no
        # public Go API, so doc-comment demands on exported symbols are
        # churn without a consumer. Revisit if a public package appears.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    staticcheck:
      # Upstream default ST exclusions, plus -QF1001: the `if !(a && b)`
      # idiom in step Check aggregations reads as "not all conditions
      # hold" and is clearer than a chain of negations.
      checks:
        - "all"
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        - "-QF1001"

formatters:
  enable:
    - gofmt
