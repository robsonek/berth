version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - nilerr
    - revive
    - unparam
  exclusions:
    rules:
      # database_test.go deliberately runs production-built shell scripts
      # through the local /bin/sh (a FakeRunner stub can only echo back what
      # we assume — these tests pin real shell semantics). The "tainted"
      # argument is the test-authored script itself, never user input. G204
      # stays live for production code.
      - path: internal/provision/steps/database_test\.go
        linters: [gosec]
        text: "G204"
      # Same deliberate local-/bin/sh fixture (untagged by design so
      # `go test ./...` always pins envOverwriteScript's hardened semantics).
      - path: test/integration/envoverwrite_test\.go
        linters: [gosec]
        text: "G204"
      # TestKeyringProbeWritesNothing deliberately executes the EXACT gpg
      # command string captured from KeyringHoldsExactly against a throwaway
      # GNUPGHOME — running the real binary is the point (it pins the
      # no-write flag set). The "tainted" argv is the production-authored
      # command and test-owned temp paths, never user input.
      - path: internal/apt/apt_test\.go
        linters: [gosec]
        text: "G204"
      # The offsite env-loader tests write fixture files into their own
      # t.TempDir() and run both the loader and `set -a; . file` against them
      # — proving the parse-don't-source loader exports exactly what sourcing
      # did. gosec's taint analysis cannot see that the "tainted" path is a
      # test-owned temp dir joined with a constant basename, never user input.
      - path: internal/config/offsite_env_loader_test\.go
        linters: [gosec]
        text: "G703"
      # gosec pattern-matches the offsite secret NAME constants
      # (OffsiteS3SecretKey, OffsiteResticPassword) as hardcoded
      # credentials; they are secret-cache map KEYS (names), never values.
      - path: internal/secret/secret\.go
        linters: [gosec]
        text: "G101"
      # The integration harness probes a disposable test box over HTTPS whose
      # certs are self-signed or LE-staging by design: skipping chain
      # verification is the run's explicit shared trust decision
      # (insecureHTTPSProbes), and the SNI probe still verifies the peer
      # certificate's hostname manually. The "SSRF" URLs are the operator's
      # own BERTH_TEST_SERVER config — probing that host IS the suite's job.
      - path: ^test/integration/
        linters: [gosec]
        text: "G(402|704)"
  settings:
    gosec:
      # Writing files and directories with specific modes, and taking file
      # paths from the operator, IS this tool's job: berth provisions
      # servers and manages local config/cache files with deliberate
      # permissions. G301/G302/G306 (dir/file mode "too permissive") and
      # G304 (file path from variable) would be ~20 permanent false
      # positives here. Every other gosec rule stays live.
      # Note: G704 (SSRF) is quiet on the ssh-agent dial in
      # internal/ssh/connect.go only because (*net.Dialer).Dial is not in
      # gosec's sink list — incidental, not a suppression; the finding
      # returns if gosec ever adds it (a local unix-socket dial, judged safe).
      excludes:
        - G301
        - G302
        - G304
        - G306
    revive:
      # A bare `rules` list REPLACES revive's default rule set (verified on
      # v2.12.2: only-disabled entries left zero active rules). This flag
      # re-adds the defaults around the explicit entries, so the two
      # disabled rules below genuinely subtract from the default set.
      enable-default-rules: true
      rules:
        # The whole codebase lives under internal/ and cmd/ — there is no
        # public Go API, so doc-comment demands on exported symbols are
        # churn without a consumer. Revisit if a public package appears.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    staticcheck:
      # Upstream default ST exclusions, plus -QF1001: the `if !(a && b)`
      # idiom in step Check aggregations reads as "not all conditions
      # hold" and is clearer than a chain of negations.
      checks:
        - "all"
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        - "-QF1001"

formatters:
  enable:
    - gofmt
