name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  lint:
    # The third-party lint action deliberately runs without release-write authority.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Lint (integration tree)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags integration ./test/integration/...
  release:
    needs: lint
    runs-on: ubuntu-latest
    # Surfaced as a job-level env so step `if:` conditions can read it
    # (the `secrets` context is not available directly in `if:`).
    env:
      BERTH_TEST_SERVER: ${{ secrets.BERTH_TEST_SERVER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release notes from CHANGELOG.md
        # The tag's CHANGELOG section (plus a compare link) becomes the GitHub
        # release body. Runs first: a tag cut without its CHANGELOG section
        # fails here, before anything is built or published.
        run: .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -race ./...
      - name: Integration smoke test
        # Runs only when a disposable Debian 13 target is configured. The unit
        # tests above are the release gate; the live provision is opt-in
        # because it requires throwaway infrastructure CI may not have.
        if: ${{ env.BERTH_TEST_SERVER != '' }}
        run: go test -tags integration ./test/integration/...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
