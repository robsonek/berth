name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags integration ./test/integration/...
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Release notes script (newest CHANGELOG section)
        # release.yml builds the GitHub release body with this script; running
        # it here on the newest released section surfaces a broken script (or
        # a malformed CHANGELOG) on an ordinary PR instead of at tag time.
        run: |
          v=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          .github/scripts/release-notes.sh "v$v" > /dev/null
      - name: GoReleaser config check
        # release.yml deliberately runs the newest GoReleaser v2 (`~> v2`, not
        # pinned). This check uses the same range on every PR, so a new v2.x
        # release that rejects .goreleaser.yaml fails here first instead of at
        # tag time. The check is stricter than a release: it also fails when a
        # property is merely deprecated. A release would only warn and still
        # build, so a red check here means the config needs a migration soon,
        # not that releasing is blocked.
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check
      - name: Cross-build all release targets
        run: |
          for pair in windows/amd64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            echo "building $pair"
            GOOS=${pair%/*} GOARCH=${pair#*/} CGO_ENABLED=0 go build -o /dev/null .
          done
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go vet -tags integration ./test/integration/...
      - run: go test -race -shuffle=on ./...
  vuln:
    needs: [checks, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
