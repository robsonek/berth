name: Fuzz
on:
  schedule:
    - cron: "13 4 * * 6"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Fuzz config parsers
        run: |
          go test -run='^$' -fuzz='^FuzzValidFingerprint$' -fuzztime=5m ./internal/config/
          go test -run='^$' -fuzz='^FuzzConfigLoad$' -fuzztime=5m ./internal/config/
      - name: Fuzz secret parsers
        run: |
          go test -run='^$' -fuzz='^FuzzEnvFile$' -fuzztime=5m ./internal/secret/
          go test -run='^$' -fuzz='^FuzzLoadEnvelope$' -fuzztime=5m ./internal/secret/
      - name: Upload crash corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-corpus
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
