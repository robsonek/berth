# Keeps the SHA-pinned workflow actions from fossilizing: dependabot proposes
# pin bumps as ordinary PRs, which still go through review and CI before any
# pin moves. Go module updates are deliberately NOT enabled - the dependency
# set (including pre-listed Charm v2 modules) is deliberately managed by hand.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
