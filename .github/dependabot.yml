# Keeps the SHA-pinned workflow actions from fossilizing: dependabot proposes
# pin bumps as ordinary PRs, which still go through review and CI before any
# pin moves. Go module updates are deliberately NOT enabled - the dependency
# set (including pre-listed Charm v2 modules) is deliberately managed by hand.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Room for every pinned action at once. At 3, three PRs held red by an
    # unrelated Go standard-library advisory took every slot, and dependabot
    # could not refresh one of them that had gone two releases stale.
    open-pull-requests-limit: 10
    # codeql-action/init and codeql-action/analyze are two dependencies to
    # dependabot but one unit to CodeQL, which aborts the scan when the pair
    # straddles two releases ("Loaded a configuration file for version X, but
    # running version Y"). Ungrouped, a bump arrives as two PRs that are each
    # red on their own and only turn green once both have landed. Every other
    # action is a repository of its own with no such coupling, so they keep
    # the deliberate one-PR-per-pin review.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
