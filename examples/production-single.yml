# Production single-site config — newest PHP from Surý, MariaDB from mariadb.org,
# Valkey + a queue worker, Let's Encrypt TLS with HTTP/3, hardened.
# Copy it and edit:  cp examples/production-single.yml servers/myserver.yml
host: 203.0.113.10

ssh:
  user: root
  port: 22
  key: ~/.ssh/id_ed25519
  # Pin the host key to defeat MITM (otherwise berth trusts it on first connect).
  # List ALL key types (add -p PORT when ssh.port is not 22; scan from a trusted
  # network or use the provider console) and pin the type berth reports in its
  # TOFU prompt / mismatch errors:
  #   ssh-keyscan 203.0.113.10 | ssh-keygen -lf -
  # fingerprint: "SHA256:..."

php:
  version: "8.5"
  source: sury          # Debian ships 8.4; Surý provides 8.5

nginx:
  source: nginx         # nginx.org mainline — required for HTTP/3

database:
  engine: mariadb
  source: mariadb       # mariadb.org 12.3 LTS
  name: myapp
  user: myapp

valkey: true            # cache / session / queue backend
queue: true             # a dormant queue:work worker (your deployer starts it)
scheduler: true
cloudflare_only: false  # opt-in origin lockdown: refuse non-Cloudflare traffic with 444
                        # (default off; see README "Cloudflare origin lockdown")

fail2ban:
  bantime: 1h
  findtime: 10m
  maxretry: 5

tuning:
  valkey_maxmemory: 512mb
  mariadb_innodb_buffer_pool: 512M
  php_memory_limit: 512M       # FPM-only; CLI keeps stock -1 for workers/artisan
  php_upload_max: 64M          # max single-file upload; post_max_size and nginx
                               # client_max_body_size are derived slightly larger
  php_max_execution_time: 120  # seconds, 1-300
  php_max_input_vars: 3000     # large Filament forms can exceed the stock 1000

# Optional host-level OS provisioning (all default off).
system:
  swap: 2G              # create /swapfile (2 GiB) + vm.swappiness=10; omit to leave swap untouched
  sysctl: true          # write a conservative web/DB kernel sysctl drop-in
  timezone: Europe/Berlin   # sets the SYSTEM zone (logs, cron) and restarts cron;
                            # omit to leave the image's zone untouched

sites:
  - domain: app.example.com
    deploy_path: /var/www/app
    repository: git@github.com:acme/app.git   # optional — SSH git URL only
    ssl: true
    ssl_email: admin@example.com              # required with Let's Encrypt
    http3: true                               # needs ssl + nginx.source: nginx
