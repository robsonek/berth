# Minimal single-site config — the simplest thing that provisions.
# Copy it and edit:  cp examples/minimal.yml servers/myserver.yml
#
# One site on MariaDB from Debian's own repos, no TLS. Everything not set here
# falls back to berth's defaults (ssh.user=root, ssh.port=22, nginx debian,
# database.source=debian, scheduler on). A site without user: runs as a
# domain-derived account; every site carries its own database: {name, user}.

# Stable machine identity keying the local secret cache (~/.berth/<id>.secrets.json).
# Required; `berth init` generates one. A rename is refused; migrate deliberately per the error's recipe.
id: prod-minimal-4f2a

host: 203.0.113.10

ssh:
  key: ~/.ssh/id_ed25519   # your private SSH key

php:
  version: "8.5"

database:
  engine: mariadb

cloudflare_only: false   # opt-in origin lockdown (default off); see README "Cloudflare origin lockdown"

sites:
  - domain: app.example.com
    deploy_path: /var/www/app
    database: {name: myapp, user: myapp}
